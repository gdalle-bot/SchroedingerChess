[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "schroedingerchess"
version = "0.1.0"
description = "Haft Schrödinger Chess, where chess pieces decide what they want to be"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Guillaume Dalle" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "highspy>=1.15",
    "numpy>=2.3",
    "pulp>=4.2",
    "pygame-ce>=2.5.8",
    "twisted>=25.5",
]

[project.urls]
Repository = "https://github.com/gdalle-bot/SchroedingerChess"

[project.gui-scripts]
schroedingerchess = "schroedingerchess.__main__:main"

[project.scripts]
schroedingerchess-server = "schroedingerchess.server:main"

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
dev = [{ include-group = "test" }, "ruff>=0.15"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest]
testpaths = ["tests"]
